    title: vfat is not a POSIX filesystem (pjdfstest)
    backends: [loop-vfat]
    targets: [pjdfstest]
    tests: ["*"]
    tags: [fs-limitation]
    links: ["GOTCHAS.md#loop-vfat-is-not-a-posix-filesystem"]
    notes: |
      About half of pjdfstest's files fail, and the run ends in a bail-out
      rather than a summary.
    # Worth narrowing only if we ever want to diff vfat mount-option
    # variants against each other.

  - id: vfat-utime
    title: stress-ng utime verification fails on vfat
    backends: [loop-vfat]
    targets: [stress-ng]
    tests: [utime]
    tags: [fs-limitation, needs-triage]
    links: ["GOTCHAS.md#loop-vfat-is-not-a-posix-filesystem"]
    notes: |
      Presumably vfat's 2-second mtime granularity (and lack of atime)
      tripping `--verify`.

