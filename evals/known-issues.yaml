  # --------------------------------------------------------------- sshfs
  - id: sshfs-git-local-clone-hardlink
    title: local `git clone` verifies its hardlinks, and sshfs synthesises st_ino
    backends: [sshfs]
    targets: [git]
    tests:
      - "t0001-init.sh#37"
      - "t0003-attributes.sh#24-25,29,32-34"
      - "t0021-conversion.sh#28-30"
      - "t0033-safe-directory.sh#16"
      - "t0035-safe-bare-repository.sh#1,13"
      - "t0410-partial-clone.sh#34,38"
      - "t0610-reftable-basics.sh#26-28"
      - "t1013-read-tree-submodule.sh#1-8,10-15,18-28,30-48,51-60,65-68"
      - "t1060-object-corruption.sh#12"
      - "t1091-sparse-checkout-builtin.sh#31-32,36-38,49,77"
      - "t1350-config-hooks-path.sh#4"
      - "t1423-ref-backend.sh#36"
      - "t1460-refs-migrate.sh#9,24"
      - "t1500-rev-parse.sh#77"
      - "t1507-rev-parse-upstream.sh#1-7,9-11,13-14,17-18,21,23-27"
      - "t1600-index.sh#6"
    tags: [fs-divergence]
    links: ["GOTCHAS.md#sshfs-bineval-under-sshfs"]
    notes: |
      SFTP's `ATTRS` carries no inode number, so sshfs synthesises `st_ino`
      per path. `git clone <local path>` hardlinks each object and then
      compares `st_mode`/`st_ino`/`st_dev`/`st_size`/`st_uid`/`st_gid`
      against the source (`builtin/clone.c`), so the check fails and the
      clone dies with `fatal: hardlink different from source`. **Plain
      `git clone` of a local path does not work on sshfs at all.**

      Each script here clones, or adds a submodule (which clones), in its
      setup, so one failed setup cascades through the script; the scripts
      were attributed by that message appearing in their own logs.
      `git clone --no-hardlinks`, `git clone file://...` and mounting with
      `-o disable_hardlink` all work -- with the option, sshfs fails
      `link()` with `EPERM` instead of pretending, and git falls back to
      copying.

      Test ids seeded from run 36476334300 (git v2.55.0), 110 assertions
      across 16 scripts.

  - id: sshfs-git-no-unix-sockets
    title: git's IPC and credential-cache tests need Unix sockets on the work tree
    backends: [sshfs]
    targets: [git]
    tests:
      - "t0052-simple-ipc.sh#1-9"
      - "t0301-credential-cache.sh#2-3,7-8,10-11,13-23,25-26,28,30,32-33,37-38,40-41,43-52"
    tags: [fs-limitation]
    links: ["GOTCHAS.md#sshfs-bineval-under-sshfs"]
    notes: |
      sshfs has no Unix sockets: `bind()` on the mount fails with
      `Operation not permitted`, so the credential-cache daemon never
      starts (`unable to bind to .../credential/socket`) and simple-ipc
      finds `no server listening`. `unix-socket=no` in
      `bin/ci/fs-capabilities.sh` predicts both. The same limitation is
      recorded for vfat as `vfat-git-no-unix-sockets`.

  - id: sshfs-git-untriaged
    title: remaining git failures on sshfs, not yet attributed
    backends: [sshfs]
    targets: [git]
    tests:
      # Observed across CI runs 36476334300 and 36485450259. This list
      # DOCUMENTS a sample; it does not gate -- see the notes.
      - "t0003-attributes.sh#41,48"
      - "t0017-env-helper.sh#4"
      - "t0040-parse-options.sh#37"
      - "t0061-run-command.sh#6,18"
      - "t0302-credential-store.sh#57"
      - "t0450-txt-doc-vs-help.sh#131,647,797"
      - "t0610-reftable-basics.sh#61"
      - "t1091-sparse-checkout-builtin.sh#21,43,48"
      - "t1092-sparse-checkout-compatibility.sh#55"
      - "t1300-config.sh#194,197,237,285,494"
      - "t1403-show-ref.sh#9"
      - "t1430-bad-ref-name.sh#26"
      - "t1450-fsck.sh#36"
      - "t1461-refs-list.sh#415"
      - "t1503-rev-parse-verify.sh#4"
      - "t1700-split-index.sh#10-12,14-15"
    tags: [needs-triage]
    links: ["GOTCHAS.md#sshfs-bineval-under-sshfs"]
    notes: |
      **These are flaky, not fixed divergences, and this entry cannot
      gate the cell.** Two mechanisms above are deterministic; this
      residue is not. Measured three ways:

      - The same cell on two CI runs of near-identical code
        (36476334300, then 36485450259) reported 12 and 18 residual
        failures with **no overlap**: every id the first run flagged
        passed in the second, and vice versa. The two mechanism entries
        meanwhile reproduced exactly both times, 110 and 46.
      - Locally, six runs of `t0003 t0017 t0040 t1700` under sshfs:
        `t0003`'s six hardlink assertions failed in all six runs, while
        `t0017#4` failed in one and `t0040#37`, `t1700#10-15` and
        `t0003#41`/`#48` in none -- although CI has flagged each of them.
      - `prove --jobs 1` is no cleaner than `--jobs 4`, and 14 runs of
        `t0017` alone were all clean, so it takes the fuller suite's
        concurrent load to show up at all.

      Some of these tests touch no filesystem semantics whatsoever --
      `t0040#37` "OPT_CALLBACK() and OPT_BIT() work" and `t0017#4`
      "test-tool env-helper --type=ulong" parse arguments and
      environment variables, and `t0450` compares documentation against
      `-h` output. What they do share is capturing output into `>out` /
      `2>err` inside the trash directory on the mount and then grepping
      it, which points at the mount losing or delaying writes under
      concurrent load rather than at any semantic divergence.

      So a `script#N` list is the wrong instrument here: each run draws a
      different sample, and pinning one run's sample is what made this
      cell report `failing-new` twice.

      Mounting with `-o cache=no` (`--no-cache`) was measured, not
      guessed: five runs of `t0*.sh` at `--jobs 4`, counting failures
      beyond the 64 this subset's two mechanisms own. Baseline drew 4, 8
      and 8; `cache=no` drew 1 and 2, for about 7% more wall clock (107s
      -> 114s). So the cache is implicated and `cache=no` is worth having
      as a mitigation -- but it does not fix the gate, because
      `known_issues.py` sets `failing-new` on the *first* uncovered
      failure and has no tolerance for a flake budget. A rate of one per
      run still fails the cell most runs.

      Which leaves a decision rather than a patch: cover the whole cell
      with `tests: ["*"]` as `vfat-pjdfstest` does (green, but it masks
      the 110 and 46 findings and any future regression), make the cell
      non-gating, or give the verdict machinery a flake budget. That last
      one belongs in the machinery, not in this backend's PR.
