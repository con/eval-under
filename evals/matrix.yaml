#
# Single source of truth for the eval-under CI matrix.
#
# The matrix is backends x targets. A "backend" answers "which
# filesystem?" (bin/eval-under-<backend>); a "target" answers "which test
# suite do we run under it?" (bin/ci/target-<target>.sh). Every
# combination below becomes one cell of .github/workflows/test.yaml's
# job matrix.
#
# Kept external, and read rather than templated, so that:
#   - the workflow YAML stays thin (see .claude/CLAUDE.md);
#   - `bin/ci/matrix.sh` and the workflow agree by construction instead
#     of by discipline -- both read this file;
#   - adding a filesystem or a suite is a data edit, not a code edit.
#
# Consumed by:
#   bin/ci/matrix.sh        sourced by every other bin/ci script
#   bin/ci/matrix-json.sh   renders the GitHub `matrix:` value
#   bin/ci/evals.py         the same, for the bin/ci Python scripts
#
# After editing, run `bin/ci/gen-readme-matrix.sh` to refresh the
# README's badge grid.

repo-slug: con/eval-under

# Where install-target.sh unpacks/builds source trees on the *runner*
# (deliberately not on the filesystem under test -- we want the build to
# be fast and the suite's I/O to be the only thing hitting the mount).
src-dir: /opt/eval-under-src

# Pinned upstream refs. Bump deliberately, never "latest": a moving
# testsuite makes a red cell ambiguous (did the filesystem regress, or
# did upstream add a test?).
refs:
  git: v2.55.0
  # pjd/pjdfstest carries exactly one tag upstream, "0.1" (2016), and it
  # no longer builds: major()/minor()/makedev() moved to
  # <sys/sysmacros.h> in glibc 2.28 and the tree compiles with -Werror,
  # so the implicit declarations are hard errors on anything modern.
  # Master builds clean, so pin a commit on master instead -- same
  # determinism, minus the patch we would otherwise have to carry.
  pjdfstest: 85a8aea9e685999ef0540392fd80535f873d7ff7
  # The datalad-benchmarks target takes DataLad's release sdist from
  # PyPI -- the release bundle, which ships benchmarks/ next to the
  # package -- and installs that same tarball, so the benchmarks and the
  # code they time come from one release by construction.
  datalad: 1.7.1
  # Provides the `ls` that api.supers.time_ls* time; it left DataLad core.
  datalad-deprecated: 1.0.1
  # asv-runner >= 0.2.2 runs a class's setup() before its setup_cache
  # (airspeed-velocity/asv_runner#52), breaking every DataLad benchmark
  # whose setup() reads what setup_cache wrote, and asv >= 0.6.6 needs
  # asv-runner >= 0.2.5. DataLad's own CI caps both for that reason
  # (.github/workflows/benchmarks.yml); these are the tops of its ranges.
  asv: 0.6.5
  asv-runner: 0.2.1

# Column order of the README CI matrix.
#
#   timeout        wall-clock budget for the wrapped suite, in seconds.
#                  Kept below the job-level timeout so a runaway suite
#                  produces a `timeout` exit code (and our logs) rather
#                  than a bare GitHub cancellation.
#   loop-size-mb   backing-image size for `eval-under loop --size`.
#   needs-root     the suite is meaningless without privilege, so the
#                  NFS backend must export no_root_squash for it.
#                  pjdfstest is half privileged-vs-unprivileged
#                  assertions and refuses to run otherwise; stress-ng's
#                  chown/mknod stressors need CAP_CHOWN / CAP_MKNOD.
targets:
  - name: git-annex
    label: git-annex test
    timeout: 2400
    loop-size-mb: 100
    needs-root: false
    needs-git-annex: true

  - name: git
    label: git testsuite
    timeout: 2400
    loop-size-mb: 512
    needs-root: false
    needs-git-annex: false

  - name: stress-ng
    label: stress-ng
    timeout: 900
    # copy-file's minimum --copy-file-bytes is 128M, and it needs source
    # + destination, so 512 leaves uncomfortably little slack.
    loop-size-mb: 768
    needs-root: true
    needs-git-annex: false

  # No suite to install: a few hundred write/stat/copy/stat rounds,
  # asking whether the filesystem keeps an unmodified file's stat data
  # stable. Fast, and the one cell that distinguishes "the filesystem
  # lied" from "the application is wrong" -- see con/git-annex#293.
  - name: mtime-stability
    label: mtime stability
    timeout: 600
    loop-size-mb: 100
    needs-root: false
    needs-git-annex: false

  # The git-annex half of the same question: loops unlock / unlocked
  # add and reports a failure rate instead of a pass/fail of the whole
  # `git annex test` suite.
  - name: git-annex-linkannex
    label: git-annex linkAnnex loop
    timeout: 1200
    # Rounds are metadata-heavy: 800 per mode measured ~52MB of an ext4
    # image's ~83MB usable, and vfat keeps a worktree copy of every file
    # because it has no symlinks, so it needs more. 200 per mode (the
    # current default) needs a quarter of that, but the image is sparse,
    # so the headroom costs nothing until used and leaves room to raise
    # the rounds by hand without also editing this.
    loop-size-mb: 256
    needs-root: false
    needs-git-annex: true

  # Run serially; a sync-heavy NFS or BeeGFS mount is an order of
  # magnitude slower than ext4.
  - name: pjdfstest
    label: pjdfstest
    timeout: 2400
    loop-size-mb: 256
    needs-root: true
    needs-git-annex: false

  # DataLad's asv benchmarks (refs.datalad above), on the same git-annex
  # build as the git-annex column. Timings, not conformance: a cell is
  # red only for a benchmark that errored, hit its own asv timeout, or
  # was not reached in time.
  - name: datalad-benchmarks
    label: DataLad benchmarks
    # ~7 min on ext4, half of it the 10 x 1000-file hierarchy; the
    # target stops itself short of this and reports what it did not
    # reach, rather than losing every timing to the timeout.
    timeout: 2400
    # Inodes, not bytes, are what runs out: one copy of that hierarchy is
    # ~79k inodes (465MB used at peak), and mkfs.ext4's default of one
    # inode per 16KB gives a 1024MB image only 65536.
    loop-size-mb: 2048
    needs-root: false
    needs-git-annex: true

# Row order of the README CI matrix. `version` is the literal "n/a" for
# backends with nothing to pin (see bin/ci/install-backend.sh).
backends:
  - backend: beegfs
    version: 7.4.6
    label: BeeGFS 7.4.6
  - backend: beegfs
    version: 8.1.0
    label: BeeGFS 8.1.0
  - backend: nfs
    version: n/a
    label: NFS (localhost)
  - backend: loop
    version: vfat
    label: Loop vfat
  - backend: loop
    version: ext4
    label: Loop ext4
