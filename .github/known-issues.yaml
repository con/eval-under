#
# Known issues: every failure we already understand (or have at least
# acknowledged), and where it applies. The single source of truth for
# "this cell is red, and we know why" -- the job verdicts, the status
# page, and the "Known issues" section of GOTCHAS.md are all derived
# from this file.
#
# How it is used (bin/ci/known_issues.py):
#
#   - Each cell's suite output is turned into per-test results
#     (bin/ci/collect-results.py), and every failure is matched against
#     the issues below that apply to that cell.
#   - The *job* stays green when every failure is covered by an issue,
#     and turns red on a failure no issue covers, or on a run that did
#     not complete (timeout, crash, unparsable output).
#   - The *status page and badge* always show the truth: a cell whose
#     failures are all known still reads "failing".
#   - An `expect: fail` issue whose tests all pass is reported as "not
#     reproduced" (fixed upstream?), one that matches no test that ran as
#     "stale". Neither fails the job; both are annotated on the run.
#
# Fields:
#   id        unique slug; also the anchor in GOTCHAS.md and the report
#   title     one line
#   backends  globs over backend slugs: beegfs-7.4.6, beegfs-*, nfs,
#             loop-vfat, loop-*
#   targets   target names from matrix.yaml, or "*"
#   expect    fail  -- these tests are expected to fail (default)
#             flaky -- either outcome is fine; still recorded
#   tests     test ids (globs allowed; "*" = the whole cell, i.e. not yet
#             narrowed down -- the crude mode, flagged as such in the
#             report). A trailing `#107-108,118-120` expands like prove's
#             "Failed tests:" line. Id formats per target:
#               git        t0001-init.sh#13
#               pjdfstest  chown/00.t#412
#               stress-ng  utime
#               git-annex  Tests.Repo Tests v10 unlocked.Init Tests.add
#                          (as printed by `git annex test --list-tests`)
#             TAP targets also report <file>#plan, <file>#exit and
#             <file>#bailout for scripts that die, which can be listed
#             here like any other test.
#   tags      from the vocabulary below (validated)
#   fixed-in  optional "<tool> <version>": if the cell runs that version
#             or newer and the issue still reproduces, the run says so
#   links     required: upstream bug reports, GOTCHAS.md sections, ...
#   notes     optional Markdown, rendered into GOTCHAS.md
#
# After editing: bin/ci/known_issues.py validate && bin/ci/known_issues.py gotchas

tags:
  fs-limitation: The filesystem lacks the feature by design (vfat has no symlinks); will not change.
  fs-divergence: The filesystem performs the operation, but not the way POSIX or a local filesystem does.
  tool-bug: A bug in the tool under test.
  test-assumption: The test suite assumes something the filesystem need not provide.
  build-config: Our build of the tool (flags, dependencies), not the tool itself.
  harness: eval-under's own setup (image sizes, mount options, ...), not the filesystem.
  fixed-upstream: Fixed upstream; waiting for the fix to reach what we run.
  needs-triage: Acknowledged, root cause not yet run down.

issues:
  # ---------------------------------------------------------------- vfat
  - id: vfat-not-posix
    title: vfat is not a POSIX filesystem (pjdfstest)
    backends: [loop-vfat]
    targets: [pjdfstest]
    tests: ["*"]
    tags: [fs-limitation]
    links: ["GOTCHAS.md#loop-vfat-is-not-a-posix-filesystem"]
    notes: |
      About half of pjdfstest's files fail, and the run ends in a bail-out
      rather than a summary. Worth narrowing only if we ever want to diff
      vfat mount-option variants against each other.

  - id: vfat-utime
    title: stress-ng utime verification fails on vfat
    backends: [loop-vfat]
    targets: [stress-ng]
    tests: [utime]
    tags: [fs-limitation, needs-triage]
    links: ["GOTCHAS.md#loop-vfat-is-not-a-posix-filesystem"]
    notes: |
      Presumably vfat's 2-second mtime granularity (and lack of atime)
      tripping `--verify`; not yet confirmed from the stressor's output.

  - id: vfat-git-posixperm
    title: git sets POSIXPERM from uname, never probes the work tree
    backends: [loop-vfat]
    targets: [git]
    tests:
      - "t0001-init.sh#1-5,8,10-13,20-21,28"
      - "t1301-shared-repo.sh#2-3,5-22"
    tags: [test-assumption]
    links: ["GOTCHAS.md#loop-vfat--git-testsuite-posixperm"]
    notes: |
      vfat reports mode 0755 for everything, so every permission assertion
      fails. t0001's 13 are exactly the 13 `check_config` call sites;
      t1301 (core.sharedRepository) is permission checks throughout.

  - id: vfat-git-no-unix-sockets
    title: git's IPC and credential-cache tests need Unix sockets on the work tree
    backends: [loop-vfat]
    targets: [git]
    tests:
      - "t0052-simple-ipc.sh#1-9"
      - "t0301-credential-cache.sh#2-3,7-8,10-11,13-23,25-26,28,30,32-33,37-38,40-41,43-50,52"
    tags: [fs-limitation, needs-triage]
    links: ["GOTCHAS.md#loop-vfat-is-not-a-posix-filesystem"]
    notes: |
      Both create a Unix-domain socket under the trash directory, which
      vfat cannot hold. Hypothesis from the test names; not yet confirmed
      from the .out files.

  - id: vfat-git-untriaged
    title: remaining git testsuite failures on vfat
    backends: [loop-vfat]
    targets: [git]
    tests:
      - "t0003-attributes.sh#48,54"
      - "t0008-ignores.sh#391-392"
      - "t0024-crlf-archive.sh#2"
      - "t0033-safe-directory.sh#16"
      - "t0061-run-command.sh#8-9"
      - "t0600-reffiles-backend.sh#31"
      - "t0610-reftable-basics.sh#8-25"
      - "t1060-object-corruption.sh#12"
      - "t1091-sparse-checkout-builtin.sh#49"
      - "t1300-config.sh#201,209-210,458,466-467"
      - "t1700-split-index.sh#23-24,26"
    tags: [needs-triage]
    links: ["GOTCHAS.md#loop-vfat-is-not-a-posix-filesystem"]
    notes: |
      Seeded from run 36050917994 (git v2.55.0). Split off into their own
      issues as root causes are found.

  # ----------------------------------------------------------------- NFS
  - id: nfs-chown-setid
    title: NFS does not clear setuid/setgid on chown the way pjdfstest expects
    backends: [nfs]
    targets: [pjdfstest]
    tests:
      - "chown/00.t#107-108,118-120,129-130,137-138,148-150,159-160,167-168,178-180,189-190,197-198,208-210,219-220,227-228,238-240,249-250,257-258,268-270,279-280,287-288,598-599,601,613-615,617-618,634-635,637,649,652,664,668-669,685,688,700-701,703,715-717,719-720,736-737,739,751-752,754,766-768,770-771,787-788,790,802-803,805,817-819,821-822,838-839,841,853-854,856,868-870,872-873,889-890,892"
    tags: [fs-divergence]
    links: ["GOTCHAS.md#nfs-bineval-under-nfs"]
    notes: |
      106 of chown/00.t's 1280 assertions. The cell runs `--no-root-squash`;
      under the default `root_squash` pjdfstest refuses to start at all.

  - id: nfs-pjdfstest-untriaged
    title: remaining pjdfstest failures on NFS
    backends: [nfs]
    targets: [pjdfstest]
    tests: ["chmod/00.t#117", "unlink/14.t#4"]
    tags: [fs-divergence, needs-triage]
    links: ["GOTCHAS.md#nfs-bineval-under-nfs"]

  # -------------------------------------------------------------- BeeGFS
  - id: beegfs-pjdfstest
    title: BeeGFS POSIX conformance gaps (link, mknod, rename, utimensat)
    backends: ["beegfs-*"]
    targets: [pjdfstest]
    tests:
      - "link/00.t#135-136,142-143,149-150,156-157,163-164"
      - "mknod/11.t#4,17"
      - "rename/09.t#2259-2261,2264,2279-2281,2284,2299-2301,2304,2311-2313,2316,2323-2325,2328"
      - "rename/10.t#2049-2051,2054,2056-2058,2061,2063-2065,2068,2070-2072,2075,2077-2079,2082"
      - "rename/24.t#4,9"
      - "utimensat/02.t#5,7"
      - "utimensat/08.t#5-6"
    tags: [fs-divergence, needs-triage]
    links: ["GOTCHAS.md#beegfs-bineval-under-beegfs"]
    notes: |
      Identical assertions fail on 7.4.6 and 8.1.0. Seeded from run
      36050917994; split by syscall once each is understood.

  - id: beegfs-annex-export-busy
    title: git-annex export/import fails on BeeGFS with EBUSY on rename
    backends: ["beegfs-*"]
    targets: [git-annex]
    tests:
      - "Tests.Repo Tests v10 *.export and import"
      - "Tests.Repo Tests v10 *.export and import of subdir"
      - "Tests.Repo Tests v10 *.git-remote-annex exporttree"
    tags: [build-config, fixed-upstream]
    links:
      - https://git-annex.branchable.com/bugs/35_failed_tests_on_beegfs/
      - "GOTCHAS.md#beegfs--git-annex-test"
    notes: |
      The same 8 of the 9 (repo mode x test) combinations fail on both
      BeeGFS versions (unlocked mode's `git-remote-annex exporttree`
      passes), with `renamePath:rename ... resource busy` / `mv: cannot
      move ... Device or resource busy`.
      Working hypothesis, under investigation: our git-annex build lacks
      OsPath support, which upstream's builds have -- i.e. a build
      configuration issue already addressed upstream, not a BeeGFS one.
      Add `fixed-in:` once the version is known.

  # --------------------------------------------------------- loop images
  - id: loop-annex-diskreserve
    title: git-annex test on a 100 MB loop image runs into annex.diskreserve
    backends: ["loop-*"]
    targets: [git-annex]
    tests: ["*"]
    tags: [harness]
    links: ["GOTCHAS.md#loop-git-annex-cells-annexdiskreserve"]
    notes: |
      git-annex refuses to store or fetch content when that would leave
      less than `annex.diskreserve` (default 100 MB) free, and the git-annex
      cells' loop image is 100 MB (`loop-size-mb` in matrix.yaml). Both loop
      cells log well over a hundred "not enough free space" messages; the
      ext4 control row fails for this reason, not an ext4 one. Whole-cell
      until the image is enlarged (or diskreserve lowered for the test
      run), which will also reveal what is genuinely vfat-specific.
