name: checks

# The repo's own checks (see bin/ci/run-checks.sh). Minutes rather than
# the hour test.yaml's filesystem matrix takes, and it needs no root, no
# kernel module and no cluster -- so it runs on everything, unfiltered
# by paths.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 for the tags: the version tests describe this very
      # checkout, and `git describe` in a shallow clone finds no tag to
      # report.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install check dependencies
        run: bin/ci/install-check-deps.sh

      - name: shellcheck
        run: bin/ci/run-checks.sh shellcheck

      - name: bats
        run: bin/ci/run-checks.sh bats

      - name: known issues
        run: bin/ci/run-checks.sh known-issues

      - name: unit tests
        run: bin/ci/run-checks.sh unit
