name: Loop ext4

# Thin dispatcher so this flavour gets a distinct README badge.
# Delegates all work to _test-under.yaml (reusable).
#
# Baseline flavour: ext4 loop mount, close to the default Linux root
# filesystem behaviour. Regressions here point at git-annex itself
# rather than filesystem-specific edge cases.

on:
  push:
    branches: [main, master]
    paths:
      - "bin/**"
      - "provision/**"
      - ".github/workflows/_test-under.yaml"
      - ".github/workflows/test-loop-ext4.yaml"
  pull_request:
    paths:
      - "bin/**"
      - "provision/**"
      - ".github/workflows/_test-under.yaml"
      - ".github/workflows/test-loop-ext4.yaml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # Mon 05:17 UTC

concurrency:
  group: test-loop-ext4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call:
    uses: ./.github/workflows/_test-under.yaml
    with:
      backend: "loop"
      backend-version: "ext4"
    permissions:
      contents: read
      actions: read
