name: (reusable) <target> under <backend>

# Reusable body for the eval-under framework. Takes a backend
# (beegfs / nfs / loop), a backend-version (a BeeGFS point release,
# a loop filesystem name, or `n/a` for NFS), and a target (which test
# suite to run under that filesystem): git-annex, git, stress-ng, or
# pjdfstest.
#
# Installs the backend's client-side packages, prepares the target
# (apt package or pinned-tag source build), and runs the suite with
# TMPDIR/HOME on the mounted filesystem.
#
# Invoked by per-cell dispatcher workflows so each backend x target
# combination gets its own badge URL. (GitHub only exposes one badge
# per workflow file, not per matrix cell.) Those dispatchers are
# generated -- see bin/ci/gen-dispatchers.sh.
#
# All non-trivial shell logic lives in bin/ci/*.sh so it can be shellcheck'd
# and exercised locally in the Vagrant VM. See .claude/CLAUDE.md.

on:
  workflow_call:
    inputs:
      backend:
        description: "eval-under backend: beegfs | nfs | loop"
        required: true
        type: string
      backend-version:
        description: >-
          For beegfs: point release (e.g. 7.4.6, 8.1.0).
          For loop:   filesystem type (e.g. vfat, ext4).
          For nfs:    literal "n/a" (no version to pin).
        required: true
        type: string
      target:
        description: >-
          Test suite to run under the backend:
          git-annex | git | stress-ng | pjdfstest | capabilities.
        required: false
        default: "git-annex"
        type: string
      backend-options:
        description: >-
          Extra flags passed through to the backend script, word-split
          (e.g. "--no-cache --workaround rename" for sshfs). Empty for
          the scheduled matrix cells; used by reproduce.yaml to mirror a
          reporter's mount options.
        required: false
        default: ""
        type: string
      runner:
        description: >-
          Runner image. Defaults to ubuntu-22.04 because BeeGFS DKMS
          cannot build against the 24.04 image's kernel; backends without
          an out-of-tree module can be run on either.
        required: false
        default: "ubuntu-22.04"
        type: string

jobs:
  test:
    # Default ubuntu-22.04: kernel 5.15/6.5, within BeeGFS 7.4.x and 8.x
    # DKMS support. ubuntu-24.04 hosted runners ship 6.17-azure which
    # BeeGFS kernel modules cannot build against. NFS, loop and sshfs
    # don't need this, so reproduce.yaml can point them at either image.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # to download artifacts from con/git-annex
    steps:
      - uses: actions/checkout@v4

      - name: Install backend client dependencies
        run: bin/ci/install-backend.sh "${{ inputs.backend }}" "${{ inputs.backend-version }}"

      - name: Install target ${{ inputs.target }}
        run: bin/ci/install-target.sh "${{ inputs.target }}"

      # Only the git-annex target needs the daily build (and the token
      # that fetching it requires).
      - name: Fetch latest git-annex daily build from con/git-annex
        if: inputs.target == 'git-annex'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/ci/install-git-annex-daily.sh

      - name: Configure git identity
        run: |
          git config --global user.email test@github.land
          git config --global user.name  "GitHub Almighty"

      - name: Run ${{ inputs.target }} under ${{ inputs.backend }}
        env:
          EVAL_UNDER_BACKEND_OPTS: ${{ inputs.backend-options }}
        run: >-
          sudo -E bin/ci/run-under.sh
          "${{ inputs.backend }}" "${{ inputs.backend-version }}" "${{ inputs.target }}"

      - name: Dump failure logs
        if: failure()
        run: >-
          bin/ci/dump-failure-logs.sh
          "${{ inputs.backend }}" "${{ inputs.backend-version }}" "${{ inputs.target }}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.backend }}-${{ inputs.backend-version }}-${{ inputs.target }}
          path: |
            /var/log/beegfs-*
            /opt/eval-under-src/git/t/test-results/**
          if-no-files-found: ignore
