name: BeeGFS 8.1.0

# Thin dispatcher so this version gets a distinct README badge.
# Delegates all work to _test-beegfs.yaml (reusable).

on:
  push:
    branches: [main, master]
    paths:
      - "bin/**"
      - "fixtures/beegfs/**"
      - "provision/**"
      - ".github/workflows/_test-beegfs.yaml"
      - ".github/workflows/test-beegfs-8.1.0.yaml"
  pull_request:
    paths:
      - "bin/**"
      - "fixtures/beegfs/**"
      - "provision/**"
      - ".github/workflows/_test-beegfs.yaml"
      - ".github/workflows/test-beegfs-8.1.0.yaml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # Mon 05:17 UTC

concurrency:
  group: test-beegfs-8.1.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call:
    uses: ./.github/workflows/_test-beegfs.yaml
    with:
      beegfs-version: "8.1.0"
    permissions:
      contents: read
      actions: read
