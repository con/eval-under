name: Loop vfat / git-annex test

# GENERATED FILE -- edit bin/ci/matrix.sh and re-run
# bin/ci/gen-dispatchers.sh instead of editing this by hand.
#
# Thin dispatcher so this matrix cell (loop-vfat x git-annex) gets a distinct
# README badge. All work is delegated to _test-under.yaml (reusable).

on:
  push:
    branches: [main, master]
    paths:
      - "bin/**"
      - "provision/**"
      - ".github/workflows/_test-under.yaml"
      - ".github/workflows/test-loop-vfat-git-annex.yaml"
  pull_request:
    paths:
      - "bin/**"
      - "provision/**"
      - ".github/workflows/_test-under.yaml"
      - ".github/workflows/test-loop-vfat-git-annex.yaml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # Mon 05:17 UTC

concurrency:
  group: loop-vfat-git-annex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call:
    uses: ./.github/workflows/_test-under.yaml
    with:
      backend: "loop"
      backend-version: "vfat"
      target: "git-annex"
    permissions:
      contents: read
      actions: read
