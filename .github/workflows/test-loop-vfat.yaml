name: Loop vfat

# Thin dispatcher so this flavour gets a distinct README badge.
# Delegates all work to _test-under.yaml (reusable).
#
# `--fs vfat` is git-annex's canonical "crippled filesystem" flavour
# (no fifos, no symlinks, case-insensitive) and triggers adjusted-
# branch handling in git-annex init.

on:
  push:
    branches: [main, master]
    paths:
      - "bin/**"
      - "provision/**"
      - ".github/workflows/_test-under.yaml"
      - ".github/workflows/test-loop-vfat.yaml"
  pull_request:
    paths:
      - "bin/**"
      - "provision/**"
      - ".github/workflows/_test-under.yaml"
      - ".github/workflows/test-loop-vfat.yaml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # Mon 05:17 UTC

concurrency:
  group: test-loop-vfat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call:
    uses: ./.github/workflows/_test-under.yaml
    with:
      backend: "loop"
      backend-version: "vfat"
    permissions:
      contents: read
      actions: read
