name: test

# The whole eval-under matrix, in one workflow.
#
# Cells come from .github/matrix.yaml via bin/ci/matrix-json.sh, rather
# than being spelled out here: adding a filesystem or a suite should be
# a data edit, and the shell scripts in bin/ci/ read the same file, so
# they cannot drift from what CI actually runs.
#
# All non-trivial shell logic lives in bin/ci/*.sh so it can be
# shellcheck'd and exercised locally in the Vagrant VM. See
# .claude/CLAUDE.md.

on:
  push:
    branches: [main, master]
    paths:
      - "bin/**"
      - "provision/**"
      - ".github/matrix.yaml"
      - ".github/workflows/test.yaml"
  pull_request:
    paths:
      - "bin/**"
      - "provision/**"
      - ".github/matrix.yaml"
      - ".github/workflows/test.yaml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # Mon 05:17 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.cells.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: cells
        run: echo "matrix=$(bin/ci/matrix-json.sh)" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    name: ${{ matrix.name }}
    # Per-cell runner image, from the backend row's optional `runs-on`
    # in .github/matrix.yaml (default ubuntu-22.04: its kernel stays
    # within BeeGFS DKMS support, while ubuntu-24.04 ships an azure
    # kernel the BeeGFS modules cannot build against). The 9p rows
    # override to ubuntu-24.04, where virtme-ng/virtiofsd are packaged.
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.cells) }}
    permissions:
      contents: read
      actions: read  # to download artifacts from con/git-annex
    steps:
      - uses: actions/checkout@v4

      - name: Install backend client dependencies
        run: bin/ci/install-backend.sh "${{ matrix.backend }}" "${{ matrix.version }}"

      - name: Install target ${{ matrix.target }}
        run: bin/ci/install-target.sh "${{ matrix.target }}"

      # Only the git-annex target needs the daily build (and the token
      # that fetching it requires).
      - name: Fetch latest git-annex daily build from con/git-annex
        if: matrix.target == 'git-annex'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/ci/install-git-annex-daily.sh

      - name: Configure git identity
        run: |
          git config --global user.email test@github.land
          git config --global user.name  "GitHub Almighty"

      - name: Run ${{ matrix.target }} under ${{ matrix.backend }}
        run: >-
          sudo -E bin/ci/run-under.sh
          "${{ matrix.backend }}" "${{ matrix.version }}" "${{ matrix.target }}"

      - name: Dump failure logs
        if: failure()
        run: >-
          bin/ci/dump-failure-logs.sh
          "${{ matrix.backend }}" "${{ matrix.version }}" "${{ matrix.target }}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.slug }}
          path: |
            /var/log/beegfs-*
            /var/log/eval-under-9p-virtio.log
            /opt/eval-under-src/git/t/test-results/**
          if-no-files-found: ignore

      # One tiny artifact per cell, read back by the `badges` job. A
      # matrix job cannot contribute to a `needs.*.outputs` map, so this
      # is how a fan-out reports its per-cell verdicts to a fan-in.
      - name: Record cell result
        if: always()
        run: |
          mkdir -p result
          echo "${{ job.status }}" > result/conclusion

      - name: Upload cell result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.slug }}
          path: result/conclusion

  publish:
    needs: test
    # always(): the point is to publish the red cells too.
    # Not on pull_request: a PR must not rewrite the status the README
    # and the report page show for master.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read  # to resolve each cell's job URL for the report
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results

      - name: Merge results and publish the status site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/ci/publish-status.sh
