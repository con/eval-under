# Shell logic lives in bin/ci/ and is held to shellcheck (see
# .claude/CLAUDE.md); this keeps it that way. Discovery -- every tracked
# file with a sh/bash shebang -- is in bin/ci/shellcheck.sh.
---
name: Shellcheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Check shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get -o DPkg::Lock::Timeout=60 install -y shellcheck
      - name: shellcheck
        run: bin/ci/shellcheck.sh
