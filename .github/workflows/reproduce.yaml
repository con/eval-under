name: Reproduce (on demand)

# The support entry point: someone reports "X breaks on my $FILESYSTEM",
# and you want a run of exactly that combination without waiting for a
# schedule or adding a matrix cell.
#
# Deliberately NOT generated by bin/ci/gen-dispatchers.sh and deliberately
# not part of the backends x targets matrix: it has no badge, no cron, and
# no push trigger. Every field is a dispatch input, including backends
# (sshfs) that have no scheduled cells at all.
#
# Everything below delegates to _test-under.yaml, same as the generated
# dispatchers do. See .claude/CLAUDE.md on keeping workflow YAML thin.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Filesystem to run under"
        required: true
        type: choice
        default: sshfs
        options: [sshfs, nfs, loop, beegfs]
      backend-version:
        description: >-
          loop: filesystem (ext4, vfat, xfs, btrfs, gfs2, ocfs2, f2fs,
          exfat, nilfs2, bcachefs) . beegfs: point release (7.4.6, 8.1.0).
          sshfs/nfs: leave as n/a.
        required: true
        type: string
        default: "n/a"
      target:
        description: "What to run under it"
        required: true
        type: choice
        default: capabilities
        options: [capabilities, git-annex, git, stress-ng, pjdfstest]
      backend-options:
        description: >-
          Extra backend flags, e.g. "--no-cache --workaround rename"
          (sshfs) or "--sync" (nfs). Run `bin/eval-under BACKEND --help`
          for the list.
        required: false
        type: string
        default: ""
      runner:
        description: "Runner image (beegfs requires ubuntu-22.04)"
        required: true
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, ubuntu-22.04]

# Named for the combination, so two people reproducing two different
# reports do not cancel each other.
concurrency:
  group: >-
    reproduce-${{ inputs.backend }}-${{ inputs.backend-version }}-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  call:
    uses: ./.github/workflows/_test-under.yaml
    with:
      backend: ${{ inputs.backend }}
      backend-version: ${{ inputs.backend-version }}
      target: ${{ inputs.target }}
      backend-options: ${{ inputs.backend-options }}
      runner: ${{ inputs.runner }}
    permissions:
      contents: read
      actions: read
