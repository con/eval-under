name: Probe candidate filesystems

# Reconnaissance, not a test matrix: for each candidate filesystem, try
# to stand up a throwaway instance on a stock GitHub-hosted runner and
# report what it supports. Feeds the survey in FILESYSTEMS.md and
# answers "is a bin/eval-under-<name> backend even possible here?"
# before anyone writes one.
#
# Every candidate reports a verdict and the job stays green: "could not
# be brought up on this runner" is the answer to the question, not a
# failure. Read the roll-up table in the run summary -- the check mark
# only tells you the probe itself ran.
#
# All logic lives in bin/ci/probe-backend.sh -- see .claude/CLAUDE.md.

# Reconnaissance is ~25 jobs, so it does not run on every branch push.
# Dispatch it when you want an answer; master re-runs it when the probe
# itself changes, to catch bit-rot in the bring-up recipes.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "bin/ci/probe-backend.sh"
      - "bin/ci/fs-capabilities.sh"
      - ".github/workflows/probe-filesystems.yaml"

concurrency:
  group: probe-filesystems-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.candidate }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        candidate:
          - gfs2
          - ocfs2
          - f2fs
          - exfat
          - ntfs3
          - udf
          - nilfs2
          - bcachefs
          - zfs
          - overlay
          - glusterfs
          - cephfs
          - cifs
          - sshfs
          - gocryptfs
          - encfs
          - ecryptfs
          - s3-rclone
          - lustre-client
          - openafs
          - vm-only
        include:
          # Whamcloud publishes Lustre client packages per Ubuntu LTS,
          # and 22.04 is the one with the longest support matrix -- so
          # the client-module question gets asked on both images. The
          # two cluster filesystems get the same treatment because their
          # kernel modules live in linux-modules-extra, whose contents
          # differ between runner images.
          - os: ubuntu-22.04
            candidate: lustre-client
          - os: ubuntu-22.04
            candidate: gfs2
          - os: ubuntu-22.04
            candidate: ocfs2

    steps:
      - uses: actions/checkout@v4

      - name: Probe ${{ matrix.candidate }}
        run: |
          set -o pipefail
          bin/ci/probe-backend.sh "${{ matrix.candidate }}" \
            2>&1 | tee "$RUNNER_TEMP/probe.log"

      # Runs even when the probe failed: "could not be brought up, here
      # is why" is the finding, and it belongs in the roll-up too.
      - name: Extract the summary line
        if: always()
        run: |
          grep '^SUMMARY|' "$RUNNER_TEMP/probe.log" > "$RUNNER_TEMP/summary.txt" \
            || echo "SUMMARY|${{ matrix.candidate }}|NO OUTPUT|-|probe produced no summary line|" \
               > "$RUNNER_TEMP/summary.txt"
          sed -i "s/^SUMMARY|/SUMMARY|${{ matrix.os }}|/" "$RUNNER_TEMP/summary.txt"
          cat "$RUNNER_TEMP/summary.txt"

      - name: Upload the summary line
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.os }}-${{ matrix.candidate }}
          path: ${{ runner.temp }}/summary.txt
          retention-days: 30

  # The probe answers "can this filesystem exist here?". This answers the
  # follow-up: does the *backend* -- the thing a matrix row would call --
  # actually drive it end to end? ext4 is the control.
  backend-smoke:
    name: eval-under loop --fs ${{ matrix.fs }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, gfs2, ocfs2]

    steps:
      - uses: actions/checkout@v4

      - name: Install backend deps
        run: bin/ci/install-backend.sh loop "${{ matrix.fs }}"

      - name: Run the capability probe through the backend
        run: |
          sudo bin/eval-under loop --fs "${{ matrix.fs }}" --set-home -- \
            bin/ci/fs-capabilities.sh

  # One place to read the whole run. Without this, answering "which
  # candidates came up?" means opening 24 job logs.
  roll-up:
    name: Roll-up
    runs-on: ubuntu-24.04
    needs: [probe, backend-smoke]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          path: summaries
          merge-multiple: false

      - name: Render the table
        run: |
          {
            echo "| runner | candidate | verdict | time | note |"
            echo "| --- | --- | --- | --- | --- |"
            cat summaries/*/summary.txt \
              | sort -t'|' -k3,3 -k2,2 \
              | awk -F'|' '{printf "| %s | `%s` | **%s** | %s | %s |\n", $2, $3, $4, $5, $6}'
            echo
            echo "### Capability profiles"
            echo
            echo '```'
            cat summaries/*/summary.txt | sort
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
